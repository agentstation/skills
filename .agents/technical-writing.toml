version = 1
mode = "developer"

[limits]
instruction_words = 20
descriptive_words = 25
paragraph_sentences = 6
max_warnings_per_100_words = 1.5

[rules]
long_sentence = "error"
semicolon = "error"
contraction = "error"
passive_voice = "warning"
complex_verb = "warning"
ing_main_verb = "warning"
nominalization = "warning"
phrasal_verb = "warning"
banned_word = "error"
marketing_adjective = "error"
modal_hedge = "error"
formulaic_phrase = "warning"
negative_parallelism = "warning"
assistant_scaffold = "warning"
restricted_vocabulary = "warning"
long_paragraph = "error"
em_dash = "error"
glossary_term = "error"

[terms]
additional_banned = []
allowed = []

[restricted_vocabulary]
additional = []
exceptions = []

[glossary]
path = "GLOSSARY.md"
required = true
require_approved_definitions = true
candidate_min_occurrences = 2
ignored_candidates = [
  "agent-skills",
  "AGENTS",
  "AGENTS_HOME",
  "AI",
  "API",
  "architecture-sensitive",
  "ASD",
  "assistant_scaffold",
  "automatic-selection",
  "avoid_same_host",
  "build-with-claude",
  "built-in",
  "C-like",
  "claude-code",
  "claude-opus-5",
  "Claude-side",
  "CLI",
  "code-review",
  "ChatGPT",
  "CONFIG",
  "controlled-writing",
  "deepswe_avg_cost_usd",
  "developer-facing",
  "earendil-works",
  "false-positive",
  "formulaic-style",
  "formulaic_phrase",
  "full-line",
  "getting-started",
  "GitHub",
  "glm-5",
  "GLOSSARY",
  "GOBIN",
  "GOFLAGS",
  "GOMOD",
  "GOTOOLCHAIN",
  "GOWORK",
  "GO_MODERN_GUIDELINES_DEV",
  "GPT",
  "GPT-5",
  "grok-4",
  "HOME",
  "HTML",
  "ID",
  "ignored_candidates",
  "isolation-safe",
  "K3",
  "kimi-k3",
  "long-lived",
  "machine-readable",
  "manual_approval_required",
  "MIT",
  "MODEL_SELECTION",
  "modern-guidelines",
  "multi-word",
  "negative_parallelism",
  "opt-in",
  "owner-calibrated",
  "P0",
  "pi-coding-agent",
