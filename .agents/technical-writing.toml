scan = [
  "README.md",
  "AGENTS.md",
  "ago/**/*.md",
  "autoreview/**/*.md",
  "use-modern-go/**/*.md",
  "plans/**/*.md",
  "plans/**/*.html",
  "technical-writing/**/*.md",
]
exclude = [
  ".git/**",
  "**/__pycache__/**",
  "**/evals/**",
  "**/tests/**",
]
