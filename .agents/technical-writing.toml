  "pre-PR",
  "project-specific",
  "prompt-engineering",
  "protected-content",
  "PowerShell",
  "quote-aware",
  "second-model",
  "Security-review",
  "security-panel",
  "self-tests",
  "SKILL",
  "STE100",
  "substantive-code",
  "substantive_only",
  "restricted_vocabulary",
  "technical-artifacts",
  "technical-writing",
  "TECHNICAL_WRITING",
  "TOML",
  "UPSTREAM",
  "XDG_CACHE_HOME",
  "YAML",
